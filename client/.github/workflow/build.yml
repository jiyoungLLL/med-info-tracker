name: Build Check

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: 의존성 설치
        run: yarn install --frozen-lockfile

      - name: 빌드
        id: build
        run: yarn build 2>&1 | tee build.log
        continue-on-error: true

      - name: PR 코멘트 작성
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('build.log', 'utf8');
            const success = '${{ steps.build.outcome }}' === 'success';

            const body = success
              ? `## ✅ 빌드 성공`
              : `## ❌ 빌드 실패\n\n<details>\n<summary>에러 로그 보기</summary>\n\n\`\`\`\n${log.slice(-3000)}\n\`\`\`\n</details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: 빌드 실패 시 종료
        if: steps.build.outcome == 'failure'
        run: exit 1
